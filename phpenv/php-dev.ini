; إعدادات للتطوير والتعلم فقط
display_errors = On
error_reporting = E_ALL
html_errors = On
date.timezone = Asia/Hebron
upload_max_filesize = 20M
post_max_size = 20M

; Xdebug (المحرر والخادم في نفس الحاوية)
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_host = 127.0.0.1
xdebug.client_port = 9003
